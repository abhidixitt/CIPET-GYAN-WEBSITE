[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_NETLIFY_FORMS_ENABLED = "true"
  VITE_NETLIFY_RESUME_UPLOADS_ENABLED = "true"

[[redirects]]
  from = "/app-download.apk"
  to = "/?app=coming-soon"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-yjf8hGkhUpBrbXqovQHiR/m/pgk5n+SyZnXebkZHCfc=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://img.youtube.com https://www.googletagmanager.com https://*.google-analytics.com; media-src 'self'; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.google.com; frame-src 'none'; upgrade-insecure-requests"
